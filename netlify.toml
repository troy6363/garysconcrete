[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/Assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "http://garysconcrete.com/*"
  to = "https://www.garysconcrete.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://garysconcrete.com/*"
  to = "https://www.garysconcrete.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.garysconcrete.com/*"
  to = "https://www.garysconcrete.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/upcoming.html"
  to = "/upcoming"
  status = 301
  force = true

[[redirects]]
  from = "/recent-projects.html"
  to = "/recent-projects"
  status = 301
  force = true

[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you"
  status = 301
  force = true
